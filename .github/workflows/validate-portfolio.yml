name: Validate portfolio

on:
  pull_request:
    branches: [master]
    paths:
      - "portfolio-site/**"
      - ".github/workflows/validate-portfolio.yml"
  push:
    branches: [orbital-v2-experience]
    paths:
      - "portfolio-site/**"
      - ".github/workflows/validate-portfolio.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Astro check and production build
        run: npm run build
